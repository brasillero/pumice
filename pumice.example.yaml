# Pumice configuration example.
#
# Pumice is a local proxy: a dictation app (Handy, OpenWhispr, …) sends its
# own prompt and the transcript to Pumice's OpenAI-compatible endpoint, and
# Pumice hands the request to the official CLI of a subscription you are
# logged into. Each CLI keeps its own configuration (login, gateway,
# routing); Pumice inherits it and adds none of its own.
#
# Pumice assumes nothing: no provider is enabled by default and no model is
# built in. Copy this to your own pumice.yaml, list the providers you want,
# and keep only what you change. Without a file (or with an empty one) the
# service starts with no providers: every request gets an error, and the app
# keeps its own transcript.
#
# The client picks the provider: the app sends the `model` the user chose
# (a provider id such as `claude`), and Pumice runs exactly that provider. A
# request without a model, an unknown or disabled model, or any failure is
# answered with an HTTP error (the app pastes its own transcript), and every
# request is logged with what happened and why.
#
# Pumice reads exactly one configuration file:
#   1. the path passed with --config (pumice --config my.yaml), else
#   2. the per-user file: ~/.config/pumice/pumice.yaml on Linux and macOS
#      ($XDG_CONFIG_HOME/pumice/pumice.yaml when XDG_CONFIG_HOME is set), and
#      %APPDATA%\pumice\pumice.yaml on Windows,
#   otherwise no file is used.
#
# Validate a file with: pumice check-config --config <path>
#
# Point the app's custom OpenAI-compatible provider at:
#   http://127.0.0.1:7567/v1

# TCP port the service binds to on 127.0.0.1.
port: 7567

# Total seconds budget for one dictation.
total_timeout_secs: 30

# How many requests may run their provider at the same time (1–32).
# Extra requests wait in line, first come first served; one still waiting
# when its total_timeout_secs runs out gets HTTP 503.
max_parallel: 4

# The explicit provider list. ORDER MATTERS for the model list a client
# shows: the enabled entries are listed in this order. There is NO fallback:
# a request runs exactly one provider — the one its model names.
#
# Every entry needs `id` and `enabled` (true or false, never defaulted).
# `model` is required when enabled. `timeout_secs` and `binary` are
# optional. The removed keys `default`, `prompts`, `env` and `options` are
# rejected with a message saying what replaced them.
providers:
  # Claude Code, enabled.
  - id: claude
    enabled: true
    # Any alias `claude --model` accepts; there is no built-in default.
    model: haiku
    # Per-call cap, also limited by the remaining total budget.
    timeout_secs: 30
    # null looks up "claude" on PATH, and so does any bare command name
    # (no slash); a relative path with a slash resolves against this file's
    # directory, an absolute path is used as-is.
    binary: null

  # Codex CLI, off. A disabled entry is kept out of the model list and
  # never runs; `model` may be omitted.
  - id: codex
    enabled: false
    # model: gpt-6.1-sol

  # Kimi Code CLI, off. The dictation travels in the command line, so very
  # long dictations are refused (an error; the app keeps its text). Any alias
  # from `kimi provider list` works.
  - id: kimi
    enabled: false
    # model: kimi-k2.7-code-highspeed

  # Kiro CLI, off. Pumice writes a one-off no-tools agent file into the
  # call's empty temporary directory to carry the app's system prompt; your
  # own ~/.kiro login and settings are used. `kiro-cli chat --list-models`
  # shows the model ids.
  - id: kiro
    enabled: false
    # model: claude-haiku-4.5

  # Antigravity and the generic local-server adapter are archived for now,
  # and OpenCode support was removed: listing any of them is an error.

# Dictated text is written to a log only when debug logging is enabled.
debug_log:
  enabled: false
  # Relative paths resolve against this file's directory.
  path: pumice-debug.jsonl
