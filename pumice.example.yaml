# Pumice configuration example.
#
# Every setting below is the built-in default, so the service works without
# any file. Copy this to your own pumice.yaml and keep only what you change.
#
# Pumice reads exactly one configuration file:
#   1. the path passed with --config (pumice serve --config my.yaml), else
#   2. the per-user file: ~/.config/pumice/pumice.yaml on Linux and macOS
#      ($XDG_CONFIG_HOME/pumice/pumice.yaml when XDG_CONFIG_HOME is set), and
#      %APPDATA%\pumice\pumice.yaml on Windows,
#   otherwise the defaults below apply.
#
# Validate a file with: pumice check-config --config <path>
#
# Never put credentials in this file: Pumice runs on the logins of the
# official CLIs and rejects credential-looking settings.
#
# Point Handy's Custom provider at: http://127.0.0.1:7567/v1

# TCP port the service binds to on 127.0.0.1.
port: 7567

# Provider used when a request does not select one.
default_provider: claude

# Total seconds budget for one dictation, fallback chain included.
total_timeout_secs: 30

# Providers to try, in order, after the selected one fails or times out,
# all within total_timeout_secs. The raw dictation comes back when every
# fallback fails too. Uncomment to try Codex after Claude:
fallback_order: []
# fallback_order: [codex]

providers:
  claude:
    enabled: true
    # null looks up "claude" on PATH; a relative path resolves against this
    # file's directory, an absolute path is used as-is.
    binary: null
    # Measured default from Phase 0.
    model: haiku
    # Per-call cap, also limited by the remaining total budget.
    timeout_secs: 30
    # Only non-secret routing variables may be set here, and Claude allows
    # just the one below. Uncomment to use, replacing the empty map:
    # env:
    #   ANTHROPIC_BASE_URL: "http://127.0.0.1:9999"
    env: {}
    # Claude accepts no adapter options.
    options: {}

  codex:
    enabled: true
    binary: null
    model: gpt-6.1-sol
    timeout_secs: 30
    # Codex accepts no environment overrides; routing goes through `options`.
    env: {}
    # The only supported option routes Codex through an existing gateway (an
    # http:// or https:// URL, never with credentials in it). Uncomment to
    # use, replacing the empty map:
    # options:
    #   openai_base_url: "https://your-existing-gateway.example/v1"
    options: {}

  # OpenCode is off by default. Enabling it requires an explicit
  # provider/model: with no configured provider, OpenCode silently answers
  # through a hosted default model. Upstream terms vary; startup
  # customizations and CLI-owned transcript retention remain unverified.
  # Uncomment to use, replacing the model with a provider/model you are
  # authorized to use (for example opencode/<free-model>):
  # opencode:
  #   enabled: true
  #   model: opencode/<free-model>
  #   timeout_secs: 30
  #   # OpenCode accepts no environment overrides; the adapter owns the
  #   # child environment (an inline deny-all configuration).
  #   env: {}
  #   # The only supported option selects a provider-specific reasoning
  #   # variant, for example variant: low.
  #   options: {}

  # Kiro (AWS) is off by default and unverified in this version. Enabling it
  # requires an explicit model and accepts no adapter options or env overrides.
  # The adapter supplies a workspace-local no-tools agent; your own Kiro login
  # and profile in ~/.kiro stay untouched.
  # Uncomment to use, replacing the model with one you are authorized to use:
  # kiro:
  #   enabled: true
  #   model: claude-sonnet-4.6
  #   timeout_secs: 30
  #   # Kiro accepts no environment overrides.
  #   env: {}
  #   options: {}

  # Antigravity (agy) is registered but cannot be enabled yet: no supported
  # per-launch tool policy exists, and third-party integration may risk
  # account access (docs/research/phase2-architecture.md §3.2). Writing
  # `enabled: true` below is refused by `pumice check-config`.
  # antigravity:
  #   enabled: false

  # Generic OpenAI-compatible endpoint on this machine (Ollama, LM Studio).
  # Disabled by default: it talks HTTP to an unauthenticated loopback server,
  # which needs the owner's explicit approval (the AGENTS.md outbound-call
  # exception is still pending; see docs/research/phase2-architecture.md §3.3).
  # When enabled, `model` and `options.base_url` are both required, and the
  # base URL must be exactly http://127.0.0.1:<port>/v1,
  # http://localhost:<port>/v1 or http://[::1]:<port>/v1 (an explicit port,
  # the /v1 path, nothing else). Pumice's own port is refused, so a dictation
  # can never route back into this service. The endpoint needs no key; the
  # local server controls inference routing and retention.
  # generic:
  #   enabled: true
  #   model: qwen2.5-7b
  #   options:
  #     base_url: "http://127.0.0.1:11434/v1"

  # Kimi Code CLI (kimi) is off by default. Moonshot subscription terms rate
  # non-interactive automation as risky (docs/research/S0.3-provider-terms.md),
  # and the dictation travels in the command line (size-capped), so enabling
  # this is the owner's call. When enabled, the adapter runs the CLI with a
  # no-tools agent file in a fresh empty workspace; user-configured hooks,
  # plugins and CLI-owned session retention have no per-launch off switch.
  # The default model is the cheapest alias verified in the owner's account;
  # any alias from `kimi provider list` works.
  # kimi:
  #   enabled: true
  #   # model: kimi-k2.7-code-highspeed
  #   timeout_secs: 30
  #   # Kimi accepts no environment overrides; the adapter owns the child
  #   # environment (no-tools agent file, skills off, telemetry off).
  #   env: {}
  #   options: {}

# Optional formatting instructions, added after Pumice's fixed instruction.
# Both are off by default (null); a block scalar (|) keeps line breaks.
prompts:
  # Example: replace `system: null` with a block scalar:
  # system: |
  #   Preserve technical terms and product names.
  system: null
  # Example: replace `user: null` with a block scalar:
  # user: |
  #   Format spoken enumerations as Markdown lists.
  user: null

# Dictated text is written to a log only when debug logging is enabled.
debug_log:
  enabled: false
  # Relative paths resolve against this file's directory.
  path: pumice-debug.jsonl
