name: Release preview

# Builds the single Pumice executable for all supported targets, packages
# release archives and npm tarballs with generated notices, and tests installs
# through a loopback registry. Previews never publish. See docs/install.md.

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - scripts/package_release.py
      - scripts/package_npm.py
      - scripts/third_party_notices.py
      - scripts/notices/**
      - scripts/npm_registry_fixture.py
      - scripts/ci_cargo_cache.py
      - scripts/test_ci_cargo_cache.py
      - scripts/test_package_release.py
      - scripts/test_package_npm.py
      - scripts/test_third_party_notices.py
      - scripts/test_npm_install.py
      - scripts/test_npm_launcher.py
      - scripts/npm/**
      - scripts/INSTALL.md
      - src/**
      - .cargo/config.toml
      - LICENSE
      - pumice.example.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A new push to a pull request cancels that PR's older preview. Manual runs
# (the owner's release builds) get a group of their own (the run ID), so
# nothing cancels them, and other PRs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  package-tests:
    name: Packaging helper tests
    runs-on: ubuntu-latest
    # The Rust version every job that builds a shipped binary installs: the
    # one the standard-library notices are pinned to, RUST_VERSION in
    # scripts/third_party_notices.py, its single source
    # (p14.3-npm-bundles/D4). Moving to a newer Rust re-pins the notices
    # there; see scripts/notices/README.md.
    outputs:
      rust-version: ${{ steps.rust.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # tomllib needs Python >= 3.11; pin it instead of trusting the image.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run packaging helper unit tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Read the pinned Rust version
        id: rust
        run: echo "version=$(python3 scripts/third_party_notices.py --print-rust-version)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: package-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            npm: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm: win32-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            npm: darwin-x64
          - os: macos-15
            target: aarch64-apple-darwin
            npm: darwin-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Extract crate version
        id: meta
        run: echo "version=$(python3 scripts/package_release.py --print-version)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.package-tests.outputs.rust-version }}
          targets: ${{ matrix.target }}

      # The musl target needs the musl toolchain for linking; install it only
      # on the Linux runner that cross-compiles to musl.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: ./.github/actions/cargo-cache
        with:
          name: release-core-${{ matrix.target }}
          build: pumice (release, --target ${{ matrix.target }})

      # Only the product executable; the fake CLI is a test-only binary and
      # must never ship in a release archive.
      - name: cargo build --release --locked --bin pumice
        run: cargo build --release --locked --bin pumice --target ${{ matrix.target }}

      - name: Smoke test binary --version
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/pumice"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          out="$("$bin" --version)"
          echo "$out"
          test "$out" = "pumice ${{ steps.meta.outputs.version }}"

      # Locate dumpbin through vswhere instead of ilammy/msvc-dev-cmd (which
      # still pins an old Node runtime): the default MSVC tools version's
      # x64 dumpbin, not a recursive search of the whole Visual Studio tree
      # (about a minute). A static CRT means no vcruntime / msvcp / ucrtbase
      # / api-ms-win-crt dependencies.
      - name: Verify exe has no CRT DLL dependencies
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { Write-Error 'FAIL: Visual Studio C++ x64 tools not found via vswhere'; exit 1 }
          $tools = (Get-Content (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -TotalCount 1).Trim()
          $dumpbin = Join-Path $vs "VC\Tools\MSVC\$tools\bin\Hostx64\x64\dumpbin.exe"
          if (-not (Test-Path $dumpbin -PathType Leaf)) { Write-Error "FAIL: dumpbin.exe not found at $dumpbin"; exit 1 }
          $output = & $dumpbin /dependents "target\${{ matrix.target }}\release\pumice.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: dumpbin exited with $LASTEXITCODE"; exit 1 }
          $output | ForEach-Object { Write-Host $_ }
          $text = ($output | Out-String).ToLowerInvariant()
          foreach ($name in @('vcruntime', 'msvcp', 'ucrtbase', 'api-ms-win-crt')) {
            if ($text.Contains($name)) {
              Write-Error "FAIL: pumice.exe depends on '$name' (CRT must be statically linked)"
              exit 1
            }
          }
          Write-Host 'OK: pumice.exe has no CRT DLL dependencies'

      - name: Verify Linux binary is statically linked
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          bin="target/${{ matrix.target }}/release/pumice"
          file "$bin"
          python3 - "$bin" <<'PYCODE'
          import subprocess
          import sys
          binary = sys.argv[1]
          headers = subprocess.check_output(["readelf", "-l", binary], text=True)
          dynamic = subprocess.check_output(["readelf", "-d", binary], text=True)
          if "INTERP" in headers or "(NEEDED)" in dynamic:
              sys.exit("FAIL: Linux release binary needs a dynamic loader or library")
          print("OK: fully static musl executable")
          PYCODE

      # The archives carry pumice alone, so their notices cover the core.
      - name: Generate third-party notices
        run: >
          python3 scripts/third_party_notices.py
          --platform ${{ matrix.npm }} --output-dir "$RUNNER_TEMP/notices"

      - name: Package archive
        run: >
          python3 scripts/package_release.py
          --target ${{ matrix.target }}
          --binary "target/${{ matrix.target }}/release/pumice"
          --notices "$RUNNER_TEMP/notices/${{ matrix.npm }}.md"
          --output-dir dist

      - name: Smoke test packaged archive
        shell: bash
        run: |
          archive="$(ls "dist/pumice-${{ steps.meta.outputs.version }}-${{ matrix.target }}".*)"
          tmp="$(mktemp -d)"
          python3 - "$archive" "$tmp" <<'PY'
          import sys
          import tarfile
          import zipfile

          archive, dest = sys.argv[1], sys.argv[2]
          if archive.endswith(".zip"):
              zipfile.ZipFile(archive).extractall(dest)
          else:
              tarfile.open(archive).extractall(dest)
          PY
          exe="pumice"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then exe="pumice.exe"; fi
          bin="$tmp/pumice-${{ steps.meta.outputs.version }}-${{ matrix.target }}/$exe"
          out="$("$bin" --version)"
          echo "$out"
          test "$out" = "pumice ${{ steps.meta.outputs.version }}"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: pumice-${{ steps.meta.outputs.version }}-${{ matrix.target }}
          path: dist/pumice-${{ steps.meta.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

      - uses: ./.github/actions/cargo-cache-save

  checksums:
    name: Aggregate checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pumice-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum pumice-* > SHA256SUMS
          cat SHA256SUMS
          echo '### Release preview assets' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release preview
        uses: actions/upload-artifact@v7
        with:
          name: release-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7

  npm-pack:
    name: Stage and pack npm packages
    needs:
      - package-tests
      - checksums
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # cargo metadata for the notices; nothing is compiled, but the notices
      # check rustc against the pinned version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.package-tests.outputs.rust-version }}

      - name: Download release preview archives
        uses: actions/download-artifact@v8
        with:
          name: release-preview
          path: dist

      - name: Generate the third-party notices
        run: |
          cargo fetch --locked
          python3 scripts/third_party_notices.py --output-dir notices

      # Validate archive hashes, stage the five packages and audit each tarball.
      - name: Stage and pack npm tarballs
        run: >
          python3 scripts/package_npm.py
          --archives-dir dist
          --notices-dir notices
          --output-dir dist/npm

      - name: Report package sizes
        run: |
          {
            echo '### npm packages'
            echo
            cat dist/npm/PACKAGES.md
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload npm preview
        uses: actions/upload-artifact@v7
        with:
          name: npm-preview
          path: dist/npm
          if-no-files-found: error
          retention-days: 7

  npm-smoke:
    name: npm install smoke (${{ matrix.npm }})
    needs: npm-pack
    if: ${{ !cancelled() && needs.npm-pack.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            npm: linux-x64
          - os: windows-latest
            npm: win32-x64
          - os: macos-15-intel
            npm: darwin-x64
          - os: macos-15
            npm: darwin-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # A path with spaces, outside the checkout, for the install; every
      # command after it runs from SMOKE/elsewhere, an unrelated cwd.
      - name: Extract crate version
        id: meta
        run: |
          echo "version=$(python3 scripts/package_npm.py --print-version)" >> "$GITHUB_OUTPUT"
          echo "SMOKE=$(cd "$GITHUB_WORKSPACE/.." && pwd)/npm smoke" >> "$GITHUB_ENV"

      - name: Download npm preview
        uses: actions/download-artifact@v8
        with:
          name: npm-preview
          path: dist/npm

      - name: Start loopback test registry
        shell: bash
        run: |
          python3 scripts/npm_registry_fixture.py --root dist/npm > registry.log 2>&1 &
          echo "PUMICE_TEST_REGISTRY_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 120); do
            grep -q "listening on" registry.log && break
            kill -0 "$!" 2>/dev/null || break
            sleep 1
          done
          cat registry.log
          grep -q "listening on" registry.log
          echo "PUMICE_TEST_REGISTRY_URL=$(sed -n 's/.*listening on //p' registry.log)" >> "$GITHUB_ENV"

      - name: Install pumice through the test registry
        shell: bash
        run: |
          mkdir -p "$SMOKE/elsewhere"
          : > "$SMOKE/npm-userconfig.ini"
          : > "$SMOKE/npm-globalconfig.ini"
          npm install -g "@brasillero/pumice@${{ steps.meta.outputs.version }}" \
            --registry "$PUMICE_TEST_REGISTRY_URL" \
            --prefix "$SMOKE/prefix" \
            --userconfig "$SMOKE/npm-userconfig.ini" \
            --globalconfig "$SMOKE/npm-globalconfig.ini" \
            --cache "$SMOKE/npm-cache" \
            --no-audit --no-fund --loglevel=error
          bin="$SMOKE/prefix/bin/pumice"
          [ -f "$bin" ] || bin="$SMOKE/prefix/pumice"
          echo "PUMICE_BIN=$bin" >> "$GITHUB_ENV"
          native="$(find "$SMOKE/prefix" -type d -path '*/@brasillero/pumice-${{ matrix.npm }}' | head -n 1)"
          test -n "$native"
          echo "PUMICE_NATIVE=$native" >> "$GITHUB_ENV"
          echo "installed $native:"
          ls -lR "$native/bin"

      - name: Run installed pumice --version
        run: |
          cd "$SMOKE/elsewhere"
          out="$("$PUMICE_BIN" --version)"
          echo "$out"
          test "$out" = "pumice ${{ steps.meta.outputs.version }}"

      - name: Check installed files
        run: |
          python3 - "$PUMICE_NATIVE" <<'PYCODE'
          import os
          import sys
          from pathlib import Path
          native = Path(sys.argv[1])
          exe = "pumice.exe" if os.name == "nt" else "pumice"
          assert sorted(p.name for p in (native / "bin").iterdir()) == [exe]
          if os.name != "nt":
              assert os.access(native / "bin" / exe, os.X_OK)
          assert (native / "THIRD_PARTY_NOTICES.md").is_file()
          PYCODE

      - name: npx through the test registry
        run: |
          cd "$SMOKE/elsewhere"
          args=(--version)
          expected="pumice ${{ steps.meta.outputs.version }}"
          out="$(npx --yes \
            --registry "$PUMICE_TEST_REGISTRY_URL" \
            --userconfig "$SMOKE/npm-userconfig.ini" \
            --globalconfig "$SMOKE/npm-globalconfig.ini" \
            --cache "$SMOKE/npx-cache" \
            "@brasillero/pumice@${{ steps.meta.outputs.version }}" "${args[@]}")"
          echo "$out"
          test "$out" = "$expected"

      # Recorded, not enforced: whether files npm extracts carry Gatekeeper's
      # quarantine attribute (the docs depend on the answer).
      - name: Quarantine attribute on the npm-installed files (macOS)
        if: runner.os == 'macOS'
        run: |
          count="$(xattr -lr "$PUMICE_NATIVE" 2>/dev/null | grep -c com.apple.quarantine || true)"
          tarball="$(xattr -l dist/npm/brasillero-pumice-${{ matrix.npm }}-*.tgz 2>/dev/null | grep -c com.apple.quarantine || true)"
          echo "- ${{ matrix.npm }}: com.apple.quarantine on $count installed entries (downloaded artifact tarball: $tarball)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop test registry
        if: always()
        run: kill "$PUMICE_TEST_REGISTRY_PID" 2>/dev/null || true

  npm-smoke-managers:
    name: pnpm/Bun install smoke (linux-x64)
    needs: npm-pack
    if: ${{ !cancelled() && needs.npm-pack.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          version: "12.6"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Extract crate version
        id: meta
        run: echo "version=$(python3 scripts/package_npm.py --print-version)" >> "$GITHUB_OUTPUT"

      - name: Download npm preview
        uses: actions/download-artifact@v8
        with:
          name: npm-preview
          path: dist/npm

      - name: Start loopback test registry
        shell: bash
        run: |
          python3 scripts/npm_registry_fixture.py --root dist/npm > registry.log 2>&1 &
          echo "PUMICE_TEST_REGISTRY_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 120); do
            grep -q "listening on" registry.log && break
            kill -0 "$!" 2>/dev/null || break
            sleep 1
          done
          cat registry.log
          grep -q "listening on" registry.log
          echo "PUMICE_TEST_REGISTRY_URL=$(sed -n 's/.*listening on //p' registry.log)" >> "$GITHUB_ENV"

      # Resolve the native optional dependency through pnpm's isolated layout.
      - name: Install and run with pnpm
        shell: bash
        run: |
          export PNPM_HOME="$PWD/pnpm-home"
          mkdir -p "$PNPM_HOME"
          # pnpm refuses a global install whose bin dir is not on PATH.
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm add -g "@brasillero/pumice@${{ steps.meta.outputs.version }}" \
            --registry "$PUMICE_TEST_REGISTRY_URL" \
            --store-dir "$PWD/pnpm-store" \
            --reporter=append-only
          out="$("$PNPM_HOME/bin/pumice" --version)"
          echo "$out"
          test "$out" = "pumice ${{ steps.meta.outputs.version }}"

      - name: Install and run with Bun
        shell: bash
        run: |
          export BUN_INSTALL="$PWD/bun-install"
          bun add -g "@brasillero/pumice@${{ steps.meta.outputs.version }}" \
            --registry "$PUMICE_TEST_REGISTRY_URL"
          out="$("$BUN_INSTALL/bin/pumice" --version)"
          echo "$out"
          test "$out" = "pumice ${{ steps.meta.outputs.version }}"

      - name: Stop test registry
        if: always()
        run: kill "$PUMICE_TEST_REGISTRY_PID" 2>/dev/null || true
