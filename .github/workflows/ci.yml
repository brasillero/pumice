name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      # Tests only ever run the fake CLI (`pumice-test-cli`); no real AI CLI
      # is installed on the runners, so a test that reached one would fail.
      - name: cargo test
        run: cargo test --workspace --locked

      # Only the product executable; the fake CLI is a test-only binary.
      - name: cargo build --release --bin pumice
        run: cargo build --release --locked --bin pumice

      - name: cargo build --release --bin pumice-relay
        run: cargo build --release --locked --workspace --bin pumice-relay

      - name: Report release binary size
        shell: bash
        run: |
          bin=target/release/pumice
          [ -f "$bin.exe" ] && bin="$bin.exe"
          size=$(wc -c < "$bin")
          echo "pumice release binary: $size bytes"
          echo "pumice release binary (${{ matrix.os }}): $size bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify release exe has no CRT DLL dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $output = dumpbin /dependents target\release\pumice.exe
          $output | ForEach-Object { Write-Host $_ }
          $text = ($output | Out-String).ToLowerInvariant()
          $forbidden = @('vcruntime', 'msvcp', 'ucrtbase', 'api-ms-win-crt')
          foreach ($name in $forbidden) {
            if ($text.Contains($name)) {
              Write-Error "FAIL: pumice.exe depends on '$name' (CRT must be statically linked)"
              exit 1
            }
          }
          Write-Host "OK: pumice.exe has no CRT DLL dependencies"

      - name: Upload release binary
        uses: actions/upload-artifact@v5
        with:
          name: pumice-release-${{ matrix.os }}
          path: |
            target/release/pumice
            target/release/pumice.exe
          if-no-files-found: ignore

  transcription-engine:
    name: Transcription CPU engine smoke (Linux)
    runs-on: ubuntu-latest
    env:
      MODEL_URL: https://huggingface.co/handy-computer/whisper-tiny-gguf/resolve/6687f30c99641ee265df421e582354adbc8848fc/whisper-tiny-Q8_0.gguf
      MODEL_SHA256: 325b9c7997cd1eff81ef709d55766565e71be696130cc3a3d444713798706834
      MODEL_DIR: ${{ github.workspace }}/.pumice-models
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy -p pumice-transcription --features engine
        run: cargo clippy -p pumice-transcription --features engine --all-targets --locked -- -D warnings

      - name: cargo build --release -p pumice-transcription --features engine
        run: cargo build --release -p pumice-transcription --features engine --locked

      - name: Cache Whisper tiny Q8_0 model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: whisper-tiny-q8_0-${{ env.MODEL_SHA256 }}

      - name: Download and verify model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$MODEL_DIR"
          curl -L --fail -o "$MODEL_DIR/whisper-tiny-Q8_0.gguf" "$MODEL_URL"
          echo "$MODEL_SHA256  $MODEL_DIR/whisper-tiny-Q8_0.gguf" | sha256sum -c -

      - name: Smoke test transcription with tiny model
        run: |
          bin="target/release/pumice-transcribe"
          out="$($bin file crates/transcription/tests/fixtures/sample-pt.wav \
            --model "$MODEL_DIR/whisper-tiny-Q8_0.gguf" --json)"
          echo "$out"
          echo "$out" | python3 - <<'PY'
          import json, sys
          data = json.loads(sys.stdin.read().strip())
          assert data.get("schema_version") == 1, data
          assert data.get("ok") is True, data
          assert data["result"]["language"] == "pt", data
          assert data["result"]["text"], data
          print("smoke ok")
          PY
