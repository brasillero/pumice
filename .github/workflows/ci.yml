name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # About 3x the slowest recent job (~10 min on Windows), so a hung test
    # fails the run instead of holding a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      # Tests only ever run the fake CLI (`pumice-test-cli`, built as
      # `pumice-root-test-cli` for the root package); no real AI CLI
      # is installed on the runners, so a test that reached one would fail.
      # About 4x the slowest recent step (~2.5 min on Windows).
      - name: cargo test
        timeout-minutes: 10
        run: cargo test --workspace --locked

      # Only the product executable; the fake CLI is a test-only binary.
      - name: cargo build --release --bin pumice
        run: cargo build --release --locked --bin pumice

      - name: cargo build --release --bin pumice-relay
        run: cargo build --release --locked --workspace --bin pumice-relay

      - name: Report release binary size
        shell: bash
        run: |
          bin=target/release/pumice
          [ -f "$bin.exe" ] && bin="$bin.exe"
          size=$(wc -c < "$bin")
          echo "pumice release binary: $size bytes"
          echo "pumice release binary (${{ matrix.os }}): $size bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify release exe has no CRT DLL dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $output = dumpbin /dependents target\release\pumice.exe
          $output | ForEach-Object { Write-Host $_ }
          $text = ($output | Out-String).ToLowerInvariant()
          $forbidden = @('vcruntime', 'msvcp', 'ucrtbase', 'api-ms-win-crt')
          foreach ($name in $forbidden) {
            if ($text.Contains($name)) {
              Write-Error "FAIL: pumice.exe depends on '$name' (CRT must be statically linked)"
              exit 1
            }
          }
          Write-Host "OK: pumice.exe has no CRT DLL dependencies"

      - name: Upload release binary
        uses: actions/upload-artifact@v5
        with:
          name: pumice-release-${{ matrix.os }}
          path: |
            target/release/pumice
            target/release/pumice.exe
          if-no-files-found: ignore
