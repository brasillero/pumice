name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Pushes to main
# and manual runs get a group of their own (the run ID), so nothing cancels
# them, and other PRs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # About 3x the slowest recent job (~10 min on Windows), so a hung test
    # fails the run instead of holding a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: ./.github/actions/cargo-cache
        with:
          name: ci
          build: clippy and tests (dev)

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Tests only ever run the fake CLI (`pumice-test-cli`); no real AI CLI
      # is installed on the runners, so a test that reached one would fail.
      # About 4x the slowest recent step (~2.5 min on Windows).
      - name: cargo test
        timeout-minutes: 10
        run: cargo test --locked

      - uses: ./.github/actions/cargo-cache-save
