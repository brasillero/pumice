name: Native compiler cache
description: Cache CMake C and C++ compilation on Linux and macOS; report statistics.
inputs:
  backend:
    description: Bundle backend identity.
    required: true
runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: |
        if [ "$RUNNER_OS" = macOS ]; then brew install ccache; else sudo apt-get update && sudo apt-get install -y ccache; fi
    - name: Identify native compilation
      id: key
      shell: bash
      env:
        BACKEND: ${{ inputs.backend }}
        SCRIPTS: ${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'crates/transcription/scripts/**', '.github/actions/*/action.yml') }}
      run: |
        identity="$({
          echo "$BACKEND $SCRIPTS $ImageOS $ImageVersion"
          echo "$TRANSCRIBE_CMAKE_ARGS $VULKAN_SDK_VERSION $VULKAN_SDK_SHA256 $MACOSX_DEPLOYMENT_TARGET"
          rustc -vV
          cmake --version
          ccache --version
          if [ "$RUNNER_OS" = macOS ]; then clang --version; xcodebuild -version; xcrun --show-sdk-version; else gcc --version; g++ --version; fi
        } | shasum -a 256 | cut -d' ' -f1)"
        echo "key=native-v1-$RUNNER_OS-$RUNNER_ARCH-$BACKEND-$identity" >> "$GITHUB_OUTPUT"
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_MAXSIZE=400M"
          echo "TRANSCRIBE_CMAKE_ARGS=$TRANSCRIBE_CMAKE_ARGS -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "PUMICE_NATIVE_CACHE=1"
        } >> "$GITHUB_ENV"
    - uses: actions/cache/restore@v6
      id: restore
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.key }}-
    - name: Record native cache state
      shell: bash
      run: |
        echo "NATIVE_CACHE_KEY=${{ steps.key.outputs.key }}" >> "$GITHUB_ENV"
        echo "NATIVE_CACHE_HIT=${{ steps.restore.outputs.cache-hit }}" >> "$GITHUB_ENV"
    - name: Reset native cache statistics
      shell: bash
      run: ccache --zero-stats
