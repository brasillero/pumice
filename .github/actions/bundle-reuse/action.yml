name: Reuse an identical bundle
description: Download the same-PR producer stage only if its full build identity matches.
inputs:
  backend:
    description: Backend name.
    required: true
outputs:
  hit:
    description: Whether an identical bundle was restored.
    value: ${{ steps.restore.outputs.hit }}
runs:
  using: composite
  steps:
    - name: Compute exact bundle identity
      id: identity
      shell: bash
      run: python3 scripts/ci_bundle_share.py identity --backend '${{ inputs.backend }}'
    - name: Restore producer bundle
      id: restore
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BACKEND: ${{ inputs.backend }}
        IDENTITY: ${{ steps.identity.outputs.value }}
      run: |
        echo "PUMICE_BUNDLE_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo 'hit=false' >> "$GITHUB_OUTPUT"
        if [ -z "$BUNDLE_PRODUCER_RUN" ]; then exit 0; fi
        shared="$RUNNER_TEMP/shared-$BACKEND"
        if ! gh run download "$BUNDLE_PRODUCER_RUN" --repo "$GITHUB_REPOSITORY" --name "shared-bundle-$BACKEND" --dir "$shared"; then exit 0; fi
        if [ "$(cat "$shared/identity")" != "$IDENTITY" ]; then
          echo 'Bundle identity differs (including pinned vs stable Rust); building locally.'
          exit 0
        fi
        mkdir -p "$STAGE"
        tar -xzf "$shared/bundle.tar.gz" -C "$STAGE"
        # A reused stage contains no compiler output. Never publish an empty
        # Cargo cache that would win the immutable-key race with the producer.
        echo 'CARGO_CACHE_HIT=true' >> "$GITHUB_ENV"
        echo 'hit=true' >> "$GITHUB_OUTPUT"
        echo "Reused $BACKEND from run $BUNDLE_PRODUCER_RUN ($IDENTITY)" >> "$GITHUB_STEP_SUMMARY"
