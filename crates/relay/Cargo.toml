[package]
name = "pumice-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pumice relay: OpenAI-compatible endpoint that hands requests to installed AI CLIs"

[lib]
name = "pumice_relay"
path = "src/lib.rs"

[[bin]]
name = "pumice-relay"
path = "src/main.rs"

# Portable fake AI CLI used only by the test suite. It is never released.
[[bin]]
name = "pumice-test-cli"
path = "tests/support/fake_cli.rs"
required-features = ["test-helpers"]
test = false
bench = false

[features]
# Builds `pumice-test-cli`. Only the self dev-dependency below turns it on, so
# tests build it and `cargo install` leaves it out.
test-helpers = []

[dependencies]
axum = { workspace = true }
process-wrap = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
jiff = { workspace = true }
ratatui = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Clears the inherit flag on the standard handles at startup
# (process::make_std_handles_non_inheritable). Already in the tree through
# tokio and tempfile.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
pumice-relay = { path = ".", features = ["test-helpers"] }
tokio = { workspace = true, features = ["test-util"] }
