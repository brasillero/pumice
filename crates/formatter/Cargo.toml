[package]
name = "pumice-formatter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pumice formatter: inject selected formatting rules into chat requests"

[lib]
name = "pumice_formatter"
path = "src/lib.rs"

[[bin]]
name = "pumice-format"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Round-trip proof that requests transformed by the formatter stay valid
# relay input.
pumice-relay = { path = "../relay" }
tempfile = { workspace = true }
