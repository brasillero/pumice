[package]
name = "pumice-transcription"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pumice transcription: local speech-to-text CLI"

[lib]
name = "pumice_transcription"
path = "src/lib.rs"

[[bin]]
name = "pumice-transcribe"
path = "src/main.rs"

[features]
default = []
opus = ["dep:opus", "dep:opusic-sys", "dep:webm-iterable"]
engine = ["dep:transcribe-cpp", "opus"]
# Opt-in Linux-only mode: the engine links as shared libraries plus one ggml
# CPU module per x86 ISA tier; the best module for the running CPU is selected
# at startup from a directory next to the executable. The default `engine`
# build stays a single static portable binary.
cpu-variants = ["engine", "transcribe-cpp/dynamic-backends"]

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
fd-lock = "4.0.4"
http-body-util = { workspace = true }
libc = { workspace = true }
futures-core = "0.3"
multer = "3.1.0"
opusic-sys = { version = "=0.7.5", default-features = false, features = ["bundled"], optional = true }
opus = { version = "=0.4.0", optional = true }
rubato = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis"] }
tokio = { workspace = true }
tokio-util = "0.7"
transcribe-cpp = { version = "=0.3.1", optional = true, default-features = false }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2"
webm-iterable = { version = "=0.7.1", default-features = false, optional = true }

[dev-dependencies]
hound = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
tempfile = { workspace = true }
