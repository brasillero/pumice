[package]
name = "pumice-transcription"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pumice transcription: local speech-to-text CLI"

[lib]
name = "pumice_transcription"
path = "src/lib.rs"

[[bin]]
name = "pumice-transcribe"
path = "src/main.rs"

[features]
default = []
engine = ["dep:transcribe-cpp"]

[dependencies]
clap = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
transcribe-cpp = { version = "=0.3.1", optional = true, default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
