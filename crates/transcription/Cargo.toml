[package]
name = "pumice-transcription"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pumice transcription: local speech-to-text CLI"

[lib]
name = "pumice_transcription"
path = "src/lib.rs"

[[bin]]
name = "pumice-transcribe"
path = "src/main.rs"

# Its own runner: the test executable is also the managed child under test,
# and libtest would write to the child's stdout.
[[test]]
name = "managed"
harness = false

[features]
default = []
opus = ["dep:opus", "dep:opusic-sys", "dep:webm-iterable"]
engine = ["dep:transcribe-cpp", "opus"]
# Opt-in mode for Linux and x86-64 Windows: the engine links as shared
# libraries plus one ggml CPU module per x86 ISA tier; the best module for the
# running CPU is selected at startup from a directory next to the executable.
# The default `engine` build stays a single static portable binary.
cpu-variants = ["engine", "transcribe-cpp/dynamic-backends"]
# Experimental (P14): `cpu-variants` plus one loadable ggml Vulkan module,
# scanned from `gpu/vulkan/` next to the executable. Only x86-64 Windows and
# x86-64 Linux with glibc get the native Vulkan build (the target-scoped
# dependency below); elsewhere, musl included, the feature builds plain
# `cpu-variants`.
vulkan = ["cpu-variants", "dep:transcribe-cpp-sys"]

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
fd-lock = "4.0.4"
http-body-util = { workspace = true }
libc = { workspace = true }
futures-core = "0.3"
multer = "3.1.0"
opusic-sys = { version = "=0.7.5", default-features = false, features = ["bundled"], optional = true }
opus = { version = "=0.4.0", optional = true }
rubato = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis"] }
tokio = { workspace = true }
tokio-util = "0.7"
transcribe-cpp = { version = "=0.3.1", optional = true, default-features = false }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2"
webm-iterable = { version = "=0.7.1", default-features = false, optional = true }

# The pinned engine's native crate, named only so the `vulkan` feature can
# turn on its Vulkan build for these targets alone (`transcribe-cpp/vulkan`
# does nothing but forward to it). Cargo unifies it with the engine's own
# copy. Keep this condition in step with `vulkan_target` in build.rs.
[target.'cfg(all(target_arch = "x86_64", any(windows, all(target_os = "linux", target_env = "gnu"))))'.dependencies]
transcribe-cpp-sys = { version = "=0.3.1", optional = true, default-features = false, features = ["vulkan"] }

[dev-dependencies]
hound = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
tempfile = { workspace = true }
