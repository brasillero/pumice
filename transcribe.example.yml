# Pumice transcription module configuration example.
#
# pumice-transcribe reads exactly one configuration file:
#   1. the path passed with --config, else
#   2. the per-user file: ~/.config/pumice/transcribe.yml on Linux and macOS
#      ($XDG_CONFIG_HOME/pumice/transcribe.yml when XDG_CONFIG_HOME is absolute),
#      and %APPDATA%\pumice\transcribe.yml on Windows,
#   and missing per-user files are created from these examples. A missing
#   explicit --config file is an error. Diagnostic commands such as models
#   catalog and backends --backend MODE do not create settings.
#
# `file` always reads a complete settings file, including with --model-file.
# Edit the automatically created per-user file or pass --config <path>.
# Creating settings never downloads a model.
#
# Every setting below must be written: leaving one out is an error that
# names the file and line. There are no built-in defaults; this file is the
# starting configuration. `null` is valid where its comment says what it
# means.
#
# Validate a file with: pumice-transcribe check-config --config <path>

schema_version: 1

# The model used when a command names none: a model id from the models
# folder below (a catalog model's catalog id, any other file's name without
# .gguf). It is checked when a command uses it, so an empty folder does not
# block `models catalog` or `models download`. null: every command must pass
# --model or --model-file.
default_model: whisper-large-v3-turbo-q8_0

# Language hint (ISO-639-1 two-letter code, e.g. pt, en). null: the engine
# detects the language.
language: pt

# Thread count for inference: 1-32, or auto (the available parallelism,
# capped at 32). --threads overrides it for one `file` run.
threads: 8

# Compute backend:
#   cpu  - the CPU only; a GPU module is never loaded
#   auto - a GPU it can identify as discrete hardware, else the CPU (the
#          reported compute snapshot says why). Integrated, software and
#          unverified (virtual, or no PCI bus id) GPUs are skipped: they
#          are usually no faster than the CPU for this work.
#   gpu  - any GPU, integrated ones included (discrete first), or a startup
#          error (never the CPU)
# Only the Vulkan preview bundles (Windows, Linux) have a GPU module.
# Override for one run with --backend on file and serve.
backend: cpu

# HTTP server settings, used by `pumice-transcribe serve`.
server:
  # Port to listen on. The server always binds 127.0.0.1 only.
  # Override with: pumice-transcribe serve --port PORT
  # null: `serve` needs --port (`pumice serve` always passes one).
  port: 17568

# The models folder. Its .gguf files are the available models; nothing else
# lists them. A file whose size and SHA-256 match a catalog model takes the
# catalog id (whisper-large-v3-turbo-q8_0), whatever its file name; any other
# .gguf file takes its exact file name without .gguf (My Model.gguf is
# "My Model"). Only the folder's own files count (no subfolders); a link to
# a file counts. The folder is read once, when a command starts.
# `pumice-transcribe models list` shows what it holds; `models download ID`
# saves a catalog model there:
#   pumice-transcribe models download whisper-large-v3-turbo-q8_0
#
# null: the per-user data directory ($XDG_DATA_HOME/pumice/models or
# ~/.local/share/pumice/models on Linux, ~/Library/Application
# Support/pumice/models on macOS, %LOCALAPPDATA%\pumice\models on Windows).
# A path overrides it: relative paths resolve against this file's directory,
# and `~` is NOT expanded — write an absolute path.
models_dir: null
