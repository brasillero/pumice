# Pumice transcription module configuration example.
#
# pumice-transcribe reads exactly one configuration file:
#   1. the path passed with --config, else
#   2. the per-user file: ~/.config/pumice/transcribe.yml on Linux and macOS
#      ($XDG_CONFIG_HOME/pumice/transcribe.yml when XDG_CONFIG_HOME is absolute),
#      and %APPDATA%\pumice\transcribe.yml on Windows,
#   otherwise no file is used; select a model with --model-file.
#
# Validate a file with: pumice-transcribe check-config --config <path>

schema_version: 1

# Optional default model id. When set it must name an entry in models below.
default_model: tiny

# Optional default language hint (ISO-639-1 two-letter code, e.g. pt, en).
language: pt

# Optional default thread count for inference (1-32).
threads: 8

# Optional HTTP server settings. Only used by `pumice-transcribe serve`.
server:
  # Port to listen on. The server always binds 127.0.0.1 only.
  # Override with: pumice-transcribe serve --port PORT
  port: 17568

# Optional override for where downloaded catalog models are stored.
# Relative paths resolve against this file's directory; `~` is NOT expanded
# — write an absolute path. The default is the per-user data directory
# ($XDG_DATA_HOME/pumice/models or ~/.local/share/pumice/models on Linux,
# ~/Library/Application Support on macOS, %LOCALAPPDATA%\pumice\models on
# Windows).
# models_dir: /absolute/path/to/models

# Explicit model list. Nothing is enabled implicitly.
models:
  # A model from the built-in catalog. Download it explicitly with:
  #   pumice-transcribe models download whisper-large-v3-turbo-q8_0
  # An entry has exactly one of `catalog:` or `path:`.
  - id: turbo
    catalog: whisper-large-v3-turbo-q8_0

  # A local GGUF file. Relative paths resolve against this file's directory.
  - id: tiny
    path: whisper-tiny-Q8_0.gguf
