[package]
name = "pumice"
version = "0.1.1"
edition = "2024"
description = "Local dictation formatting service"
license = "MIT"
default-run = "pumice"

[[bin]]
name = "pumice"
path = "src/main.rs"

# Portable fake AI CLI used only by the test suite. It is never released:
# CI builds and uploads `--bin pumice` only.
[[bin]]
name = "pumice-test-cli"
path = "tests/support/fake_cli.rs"
test = false
bench = false

[dependencies]
# HTTP API (S1.1): HTTP/1 only, no tower-http, no tracing.
axum = { version = "0.8.9", default-features = false, features = [
    "http1", "json", "tokio",
] }
process-wrap = { version = "10.0.1", default-features = false, features = [
    "tokio1", "kill-on-drop", "process-group", "job-object", "creation-flags",
] }
# Generic loopback adapter (S2.7): HTTP/1 client over a validated Tokio
# socket. hyper-util only adapts the socket; http-body-util only bounds and
# collects bodies. No TLS, proxy or redirect machinery.
hyper = { version = "1.11.1", default-features = false, features = [
    "client", "http1",
] }
hyper-util = { version = "0.1.21", default-features = false, features = [
    "tokio",
] }
http-body-util = { version = "0.1.5", default-features = false }
# Re-exported body buffer used by the generic adapter's request/response
# bodies (already a transitive dependency of hyper).
bytes = "1.12.1"
# Also used by the fake CLI binary (a binary target cannot use dev-dependencies).
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = [
    "deserialize",
] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1.53.2", features = [
    "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync",
    "time",
] }
jiff = "0.2.38"
# Live request view (S4.6).
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
# Reads only the MCP server names in the user's Codex config (S5.1).
toml = { version = "1.1.6", default-features = false, features = ["parse", "std", "serde"] }

[dev-dependencies]
# Paused clock for deterministic deadline and queue tests.
tokio = { version = "1.53.2", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
# `waitid(WNOWAIT)`: observe the CLI's exit without reaping it (src/process/tree.rs).
libc = "0.2.190"

[profile.release]
lto = true
codegen-units = 1
strip = true
