[package]
name = "pumice"
version = "0.1.0"
edition = "2024"
description = "Local dictation formatting service"
license = "MIT"
default-run = "pumice"

[[bin]]
name = "pumice"
path = "src/main.rs"

# Portable fake AI CLI used only by the test suite. It is never released:
# CI builds and uploads `--bin pumice` only.
[[bin]]
name = "pumice-test-cli"
path = "tests/support/fake_cli.rs"
test = false
bench = false

[dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = [
    "tokio1", "kill-on-drop", "process-group", "job-object", "creation-flags",
] }
# Also used by the fake CLI binary (a binary target cannot use dev-dependencies).
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = [
    "deserialize",
] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1.53.2", features = ["rt", "time", "io-util", "process"] }

[target.'cfg(unix)'.dependencies]
# `waitid(WNOWAIT)`: observe the CLI's exit without reaping it (src/process/tree.rs).
libc = "0.2.190"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
