[package]
name = "pumice"
version = "0.1.0"
edition = "2024"
description = "Local dictation formatting service"
license = "MIT"
default-run = "pumice"

[[bin]]
name = "pumice"
path = "src/main.rs"

# Portable fake AI CLI used only by the test suite. It is never released:
# CI builds and uploads `--bin pumice` only.
[[bin]]
name = "pumice-test-cli"
path = "tests/support/fake_cli.rs"
test = false
bench = false

[dependencies]
# Used by the fake CLI binary (a binary target cannot use dev-dependencies).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
