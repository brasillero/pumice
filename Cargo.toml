[workspace]
members = [".", "crates/relay"]
default-members = [".", "crates/relay"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = [
    "http1", "json", "tokio",
] }
process-wrap = { version = "10.0.1", default-features = false, features = [
    "tokio1", "kill-on-drop", "process-group", "job-object", "creation-flags",
] }
hyper = { version = "1.11.1", default-features = false, features = [
    "client", "http1",
] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1.5", default-features = false }
bytes = "1.12.1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = [
    "deserialize",
] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1.53.2", features = [
    "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync",
    "time",
] }
jiff = "0.2.38"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "std", "serde"] }
libc = "0.2.190"

[package]
name = "pumice"
version = "0.2.0"
edition = "2024"
description = "Connects dictation apps to the AI assistants you already use"
license = "MIT"
default-run = "pumice"

[[bin]]
name = "pumice"
path = "src/main.rs"

[dependencies]
pumice-relay = { path = "crates/relay" }

[dev-dependencies]
tempfile = { workspace = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
