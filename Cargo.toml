[package]
name = "pumice"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "OpenAI-compatible relay for the AI subscriptions you already use"
default-run = "pumice"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pumice"
path = "src/main.rs"

# Fake AI CLI for tests only; never shipped or installed.
[[bin]]
name = "pumice-test-cli"
path = "tests/support/fake_cli.rs"
required-features = ["test-helpers"]
test = false
bench = false

[features]
test-helpers = []

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
    "http1", "json", "tokio",
] }
process-wrap = { version = "10.0.1", default-features = false, features = [
    "tokio1", "kill-on-drop", "process-group", "job-object",
] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = [
    "deserialize",
] }
# Preserve the client's nested JSON key order.
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tokio = { version = "1.53.2", features = [
    "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync",
    "time",
] }
jiff = "0.2.38"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "std", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Console",
] }

[dev-dependencies]
pumice = { path = ".", features = ["test-helpers"] }
tokio = { version = "1.53.2", features = ["test-util"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
