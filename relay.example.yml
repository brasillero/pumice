# Pumice configuration example.
#
# Pumice is a small local tool: a dictation app (Handy, OpenWhispr, …) sends
# its own prompt and the transcript to Pumice's OpenAI-compatible address,
# and Pumice passes the request to the official CLI of a subscription you
# are logged into. Each CLI keeps its own configuration (login, gateway,
# routing); Pumice inherits it and adds none of its own.
#
# Pumice assumes nothing: every setting below must be written, and leaving
# one out is a startup error that names the file and line. There are no
# built-in defaults: the values in this file are the starting configuration.
# Pumice writes this file to the per-user location on first start when it
# is missing; edit it there, or pass your own file with --config. No provider is
# enabled unless its entry says `enabled: true`; with none enabled every AI
# request gets an error, and the app keeps its own transcript (the built-in
# `passthrough` and `inspect` still work).
#
# The client picks the provider: the app sends the `model` the user chose
# (a provider id such as `claude`), and Pumice runs exactly that provider. A
# request without a model, an unknown or disabled model, or any failure is
# answered with an HTTP error (the app pastes its own transcript), and every
# request is logged with what happened and why.
#
# Pumice reads exactly one configuration file:
#   1. the path passed with --config (pumice relay --config my.yaml), else
#   2. the per-user file: ~/.config/pumice/relay.yml on Linux and macOS
#      ($XDG_CONFIG_HOME/pumice/relay.yml when XDG_CONFIG_HOME is set), and
#      %APPDATA%\pumice\relay.yml on Windows,
#   and missing per-user files are created from these examples. A missing
#   explicit --config file is an error; doctor does not create settings.
#
# Validate a file with: pumice relay check-config --config <path>
#
# Point the app's custom OpenAI-compatible provider at:
#   http://127.0.0.1:7567/v1

# TCP port the service binds to on 127.0.0.1.
port: 7567

# Total seconds budget for one dictation.
total_timeout_secs: 30

# How many requests may run their provider at the same time (1–32).
# Extra requests wait in line, first come first served; one still waiting
# when its total_timeout_secs runs out gets HTTP 503.
max_parallel: 4

# The explicit provider list. ORDER MATTERS for the model list a client
# shows: the enabled entries are listed in this order. There is NO fallback:
# a request runs exactly one provider — the one its model names.
#
# Every entry writes all five keys: `id`, `enabled` (true or false),
# `model` (`null` only on a disabled entry), `binary` and `timeout_secs`.
# The removed keys `default`, `prompts`, `env` and `options` are rejected
# with a message saying what replaced them.
providers:
  # Claude Code, enabled.
  - id: claude
    enabled: true
    # Any alias `claude --model` accepts; there is no built-in default.
    model: haiku
    # A bare command name (no slash) is looked up on PATH; a relative path
    # with a slash resolves against this file's directory, an absolute path
    # is used as-is.
    binary: claude
    # Per-call cap, also limited by the remaining total budget.
    timeout_secs: 30

  # Codex CLI, off. A disabled entry is kept out of the model list and
  # never runs; its `model` may be null.
  - id: codex
    enabled: false
    model: null # e.g. gpt-6.1-sol
    binary: codex
    timeout_secs: 30

  # Kimi Code CLI, off. The dictation travels in the command line, so very
  # long dictations are refused (an error; the app keeps its text). Any alias
  # from `kimi provider list` works.
  - id: kimi
    enabled: false
    model: null # e.g. kimi-k2.7-code-highspeed
    binary: kimi
    timeout_secs: 30

  # Kiro CLI, off. Pumice writes a one-off no-tools agent file into the
  # call's empty temporary directory to carry the app's system prompt; your
  # own ~/.kiro login and settings are used. `kiro-cli chat --list-models`
  # shows the model ids.
  - id: kiro
    enabled: false
    model: null # e.g. claude-haiku-4.5
    binary: kiro-cli
    timeout_secs: 30

  # Antigravity and the generic local-server adapter are archived for now,
  # and OpenCode support was removed: listing any of them is an error.

# Dictated text is written to a log only when debug logging is enabled.
debug_log:
  enabled: false
  # Written even while disabled. Relative paths resolve against this
  # file's directory.
  path: pumice-debug.jsonl
