# Pumice orchestrator configuration example (for `pumice run` and
# `pumice serve`).
#
# `pumice run` reads exactly one configuration file:
#   1. the path passed with --config, else
#   2. the per-user file: ~/.config/pumice/orchestrator.yml on Linux and macOS
#      ($XDG_CONFIG_HOME/pumice/orchestrator.yml when XDG_CONFIG_HOME is
#      absolute), and %APPDATA%\pumice\orchestrator.yml on Windows.
# There is no built-in default file: without one, `pumice run` fails.
#
# The orchestrator file refers to the module configurations; it never copies
# their settings (models, provider binaries and timeouts stay in the module
# files). Every setting below must be written: leaving one out is an error
# that names the file and line. There are no built-in defaults; this file is
# the starting configuration. Full guide: docs/orchestrator.md

schema_version: 1

modules:
  # Required. The transcription module's own configuration; relative paths
  # resolve against this file's directory.
  transcription:
    config: ./transcribe.yml
  # Needed once any enabled flow selects a formatter (even a built-in); an
  # empty registry file is enough for builtin:clean. Write `formatter: null`
  # when no enabled flow selects one.
  formatter:
    config: ./formatter.yml
  # Required. Only `in_process` is supported: the relay runs inside the
  # `pumice` process using its own configuration file.
  relay:
    location: in_process
    config: ./relay.yml

# Named flows; `pumice run <AUDIO> --flow <ID>` runs one of them, and so
# does a `pumice serve` dictation naming its id. OpenAI transcriptions
# select their own model:provider:preset from serve.relay. Nothing is
# enabled implicitly: every flow writes `enabled` (true or false), and
# `formatter` is an id or null (null adds no instructions; combine it with
# `relay_route: passthrough` for a raw-only flow).
flows:
  # Dictation cleanup: transcribe with the catalog model
  # whisper-large-v3-turbo-q8_0, apply the built-in cleanup rules, call the
  # relay route `claude`. `transcription_model` is a model id from the
  # transcription models folder (`pumice-transcribe models list` shows them):
  # a catalog model's catalog id, any other .gguf file's name without .gguf.
  - id: clean
    enabled: true
    transcription_model: whisper-large-v3-turbo-q8_0
    formatter: builtin:clean
    relay_route: claude
    # Every flow writes all four budgets. One overall clock from command
    # start (for `pumice serve`, from the request's arrival, upload
    # included); a stage's deadline is the earlier of its own cap and the
    # remaining total (which never resets). The last 2500 ms of the total
    # are always reserved for cleanup and output. Under `pumice serve` the
    # smallest enabled total also bounds every upload: at most
    # min(15 s, total - 2500 ms).
    budgets_ms:
      total: 180000
      transcription: 120000
      formatter: 1000
      relay: 60000

  # Raw transcription only (an "off" flow): no formatter, and the
  # passthrough route returns the transcript without calling an AI.
  - id: raw
    enabled: true
    transcription_model: whisper-large-v3-turbo-q8_0
    formatter: null
    relay_route: passthrough
    budgets_ms:
      total: 180000
      transcription: 120000
      formatter: 1000
      relay: 60000

# `pumice serve`, the local service with one warm transcription model
# (docs/orchestrator.md). The section is written even when only `pumice run`
# is used: `enabled: false` keeps it off. Nothing starts implicitly.
serve:
  enabled: false
  # 7567 (the relay's port) is refused; 0 picks a free port and announces
  # it. `pumice serve --port` overrides it.
  port: 17570
  # A model id from the transcription models folder; every enabled flow must
  # use this model. null only while serve is disabled.
  transcription_model: whisper-large-v3-turbo-q8_0
  # From 1000 to 300000. How long the transcription module may take to list
  # its models folder (it hashes files the size of a catalog model, a few
  # seconds for large ones) and, separately, how long each child start may
  # take to read the folder again, load its model and become ready.
  startup_timeout_ms: 60000
  # The plain model always returns raw text. When relay is enabled, also
  # offer model:provider:preset. Provider order comes from relay.yml;
  # preset order comes from this list. Both expansion switches default to
  # false in this starting file (only the default combination is listed).
  budgets_ms:
    total: 180000
    transcription: 120000
    formatter: 1000
    relay: 60000
  relay:
    enabled: true
    default_provider: claude
    default_preset: builtin:clean
    presets: [builtin:clean]
    expand_providers: false
    expand_presets: false
  # Browser origins accepted besides http://127.0.0.1:<port> (`[]` accepts
  # none), for a reverse proxy on this machine such as `tailscale serve`
  # (pumice serve still listens on 127.0.0.1 only). Exact origins: http or
  # https, lowercase host, no path, no wildcards, no default port. No
  # authentication: whoever reaches the proxy can use it.
  allowed_origins: []
  # e.g. allowed_origins:
  #   - https://server-1.example-tailnet.ts.net:17570
