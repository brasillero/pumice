# Release tooling only; git-cliff 2.14.2 is pinned by CI.
[changelog]
header = """# Changelog

Changes are grouped using [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
Release versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{% for group in ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"] -%}
{% set entries = commits | filter(attribute="group", value=group) -%}
{% if entries | length > 0 %}
### {{ group }}
{% for commit in entries -%}
{% set subject = commit.message | split(pat="\n") | first | trim -%}
- {% if commit.breaking %}**BREAKING:** {% endif %}{{ subject }}{% if commit.breaking_description and commit.breaking_description | trim != subject %}: {{ commit.breaking_description | trim }}{% endif %}
{% endfor %}
{% endif -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { field = "breaking", pattern = "true", group = "Changed" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^(perf|refactor|revert)", group = "Changed" },
  { message = "^(docs|chore|test|ci|build|style)", skip = true },
  { message = ".*", group = "Changed" },
]
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.+-]+)?$"
use_branch_tags = true
topo_order = true
sort_commits = "oldest"
